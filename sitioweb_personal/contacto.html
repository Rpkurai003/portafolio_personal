<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Punto 3: Datos META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nombre del Estudiante">
    <meta name="description" content="Página de contacto y ubicación del portafolio personal.">
    <meta name="keywords" content="contacto, formulario, ubicación, mapa">
    <title>Portafolio Personal - Contacto</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" type="image/x-icon">

    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER Y NAV -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark">
            <div class="container">
                <a class="navbar-brand font-heading" href="index.html">
                    <i class="bi bi-code-slash text-danger-custom"></i> MiPortafolio
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active btn btn-danger-custom text-white ms-lg-2" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <!-- Punto 2.b: Página de contacto con formulario y mapa -->
        <h1 class="font-heading text-center mb-5 text-purple-light">Contacto y Ubicación</h1>

        <div class="row g-4">
            <!-- Formulario de Contacto -->
            <div class="col-md-6">
                <div class="card-custom p-4 rounded h-100">
                    <h3 class="font-heading mb-4"><i class="bi bi-envelope"></i> Envíame un mensaje</h3>
                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control bg-dark text-light border-purple" id="nombre" required placeholder="Tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-purple" id="correo" required placeholder="nombre@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="asunto" class="form-label">Asunto</label>
                            <input type="text" class="form-control bg-dark text-light border-purple" id="asunto" required placeholder="Motivo de contacto">
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control bg-dark text-light border-purple" id="mensaje" rows="4" required placeholder="Escribe tu mensaje..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger-custom text-white w-100">Enviar Mensaje</button>
                    </form>
                </div>
            </div>

            <!-- Mapa de Ubicación -->
            <div class="col-md-6">
                <div class="card-custom p-4 rounded h-100 d-flex flex-column">
                    <h3 class="font-heading mb-4"><i class="bi bi-geo-alt"></i> Mi Ubicación</h3>
                    <p>Encuéntrame o coordina una cita previa en la siguiente ubicación:</p>
                    <div class="ratio ratio-4x3 flex-grow-1 rounded overflow-hidden border-purple">
                        <iframe src="<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3721.916146786249!2d-101.66309012608322!3d21.11590898055534!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d201b2d667638f%3A0x8af68bbbe3262d9f!2sForum%20Cultural%20Guanajuato!5e0!3m2!1ses!2smx!4v1792976665522!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-custom-dark text-center text-white py-4 mt-auto border-top border-purple">
        <div class="container">
            <div class="mb-3">
                <a href="https://github.com" target="_blank" class="text-white me-3 fs-4"><i class="bi bi-github"></i></a>
            </div>
            <p class="mb-0">&copy; 2026 Sitio Personal. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
